# AI Travel Booking Assistant Documentation Site - Stygian theme
# Renderer: https://github.com/ksauraj/stygian (just-the-docs style)
title: AI Travel Assistant
url: "https://aavvvacado.github.io"
baseurl: "/Ai-travel-booking-assistance"
description: >-
  Voice & Chat Flight Search Engine built with Flutter Clean Architecture,
  Hybrid Gemini 1.5 Flash LLM, and Local NLP Rule Engine.

remote_theme: ksauraj/stygian

# ------------------------------------------------------------------ build
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

exclude:
  - README.md
  - vendor

# ------------------------------------------------------------------ content
# Every page under _docs/ becomes a sidebar entry.
collections:
  docs:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: docs
    values:
      layout: docs

# ------------------------------------------------------------------ theme
stygian:
  header:
    aux_links_new_tab: true
    aux_links:
      - { label: GitHub, href: https://github.com/aavvvacado/Ai-travel-booking-assistance }
  theme:
    default: dark
  edit:
    enabled: true
    repo: https://github.com/aavvvacado/Ai-travel-booking-assistance
    branch: gh-pages
    view: tree
  footer:
    note: AI Travel Assistant Docs
    right: "© 2026 aavvvacado"
